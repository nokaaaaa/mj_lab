      3,3,3,3,3,3,3,
      3,3,
      3,3,3,3,3,3,3,
    ]
  FixStand:
    transitions:
      Passive: back.on_pressed # キーボード操作時: S（緊急停止）
      Mimic_Habayose: F2.on_pressed # キーボード操作時: M（本来はVelocity経由だが一時的に直結）
