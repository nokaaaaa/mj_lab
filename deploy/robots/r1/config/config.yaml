  # Velocity:
  #   transitions:
  #     Passive: LT + B.on_pressed
  #     Mimic_Habayose: RB + A.on_pressed
  #   policy_dir: config/policy/velocity/v0

  Mimic_Habayose:
    transitions:
      Passive: back.on_pressed # キーボード操作時: S（緊急停止）
      FixStand: F2.on_pressed # キーボード操作時: M（本来はVelocity経由だが一時的に直結）

